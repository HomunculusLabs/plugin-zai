name: Publish to npm (Release)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # enables npm provenance if your npm org allows it

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build TypeScript package
        run: bun run build:ts

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION=$(node -p "require('./typescript/package.json').version")
          EXPECTED="v${PKG_VERSION}"
          echo "release tag: ${RELEASE_TAG}"
          echo "package version: ${PKG_VERSION}"
          if [ "${RELEASE_TAG}" != "${EXPECTED}" ]; then
            echo "Tag mismatch. Expected ${EXPECTED} to match typescript/package.json version."
            exit 1
          fi

      - name: Publish (typescript package)
        working-directory: typescript
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
